name: Dev prerelease

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read and verify development version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          case "$version" in
            *-dev.*) ;;
            *) echo "Development releases require a -dev.N version" >&2; exit 1 ;;
          esac
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Validate JavaScript
        run: npm run check

      - name: Test sensor recovery
        run: npm test

      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: plugin

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "Airthings Card $TAG" --generate-notes --prerelease

